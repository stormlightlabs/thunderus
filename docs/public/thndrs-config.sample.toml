# Sample thndrs config.
# Copy values into ~/.thndrs/config.toml or .thndrs/config.toml.
# Do not put provider API keys, tokens, passwords, or other secrets here.

# Setup records the initial provider and model. Uncomment to override it.
# model = "opencode/big-pickle"
websearch = "duckduckgo"
# websearch_url = "http://127.0.0.1:8080" # required for SearXNG
tick_rate_ms = 33
theme = "eldritch-minimal"
mouse = true
verbose = false

skill_dirs = ["vendor/agent-skills"]
session_dir = ".thndrs/sessions"
default_workspace = "."

# Keep manual compaction available. Use "auto" to compact before an oversized
# request, or "off" to disable both automatic compaction and /compact.
[context.compaction]
mode = "manual"
review = "auto"
threshold = "92%"
keep_recent_tokens = 20000

# External ACP agents are selected with --model acp:<name>.
# Keep credentials out of TOML. Use agent-owned auth, parent process
# environment, or a wrapper command for secrets.
# [acp_agents.codex]
# command = "npx"
# args = ["-y", "@zed-industries/codex-acp@latest"]
# env is for non-secret child process settings; values are redacted in
# diagnostics and session metadata.
# env = {}
# enabled = true
# timeout_secs = 60
