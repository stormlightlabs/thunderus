[package]
name = "thndrs-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
thndrs-core = { path = "../core" }
thndrs-ui-macros = { path = "../macros" }
thndrs-mem = { path = "../memory" }

ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
ignore = "0.4"
syntect = { version = "5", default-features = true }
nucleo-matcher = "0.3"

[dev-dependencies]

[lints]
workspace = true
