[package]
name = "thndrs-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
thndrs-core = { path = "../core" }
thndrs-providers = { path = "../providers" }

iced = { version = "0.14", features = ["tokio"] }
rfd = "0.17"
dirs = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
