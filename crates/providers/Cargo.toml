[package]
name = "thndrs-providers"
version = "0.1.0"
edition = "2024"

[dependencies]
thndrs-core = { path = "../core" }
thndrs-tools = { path = "../tools" }
thndrs-mem = { path = "../memory" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
futures-util = "0.3"
async-trait = "0.1"

[dev-dependencies]
mockito = "1.4"
tokio-test = "0.4"

[lints]
workspace = true
