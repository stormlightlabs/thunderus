[package]
name = "thndrs-mem"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
ndarray = "0.17"
rusqlite = { version = "0.33", features = [
    "bundled",
    "chrono",
    "load_extension",
] }
sqlite-vec = "0.1"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.13", features = ["json"] }
thndrs-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.10"

[lints]
workspace = true
