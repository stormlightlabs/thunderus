[package]
name = "thunderus-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "thunderus"
path = "src/main.rs"

[dependencies]
thunderus-core = { path = "../core" }
thunderus-providers = { path = "../providers" }
thunderus-ui = { path = "../ui" }

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"
anyhow = "1.0"

[lints]
workspace = true
