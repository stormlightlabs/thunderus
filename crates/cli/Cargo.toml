[package]
name = "thndrs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "thndrs"
path = "src/main.rs"

[dependencies]
thndrs-core = { path = "../core" }
thndrs-providers = { path = "../providers" }
thndrs-ui = { path = "../ui" }
thndrs-mem = { path = "../memory" }
thndrs-tools = { path = "../tools" }

clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
thiserror = "2.0"
anyhow = "1.0"
serde_json = "1.0"

[lints]
workspace = true
