name: Epic
description: A goal, a stop rule, and the sub-issues that are the work.
labels: ["kind:epic"]
body:
  - type: markdown
    attributes:
      value: |
        An epic is what a run works through. It holds a goal and the condition
        that ends it. Add sub-issues after opening this; they are the things
        `/impl` claims, and this epic is not one of them.

        A run is one pass over this epic, started by `/thunderstorm <number>`.
        A run ends when every sub-issue is terminal, its budget is spent, or a
        worker escalates. The epic stays open until its stop rule is met, so it
        may take several runs.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is different when this epic is finished.
    validations:
      required: true

  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: >
        The condition that closes this epic, checkable without judgment. This
        is the stop rule, and it is not a budget: a run can end without it
        being met.
      placeholder: |
        `thndrs mcp` lists every configured server with its trust state, and a
        project server cannot start until a recorded approval says it may.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Planned sub-issues
      description: >
        One line each. File them as sub-issues of this one after opening it:
        that relation is what a run reads, and a list here is not it. GitHub
        tracks their state, so this stays a plan rather than a checklist. Do
        not nest deeper than one level.
      value: |
        -
        -
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: The idea file, spec, or discussion this came from.
    validations:
      required: false

  - type: textarea
    id: not-in-this-epic
    attributes:
      label: Not in this epic
      description: >
        Scope this epic must not absorb. A worker that finds work here files it
        separately.
    validations:
      required: false

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low — contained, easy to revert
        - medium — crosses a module or changes observable behavior
        - high — touches released behavior, data, or security
    validations:
      required: true
