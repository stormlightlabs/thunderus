name: Epic
description: A body of work spanning several issues, and what crosses them.
labels: ["kind:epic"]
body:
  - type: markdown
    attributes:
      value: |
        An epic groups issues. It is never claimed and never dispatched: a run
        takes one issue with sub-issues, and `/storm` refuses an epic.

        File one only when the work needs more than one run. An epic holding a
        single issue is a heading.

        What it must carry is the part a run cannot see. A run works one issue
        and never loads its siblings, so a blocker between two of them, an
        ordering across them, or a file both write is invisible from inside
        either. This is the only place that survives.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is different when every issue under this is finished.
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Issues under this
      description: >
        One line each, in dispatch order. File them as sub-issues of this one
        after opening it; a list here is not that relation. Each holds at most
        five open sub-issues of its own.
      value: |
        | Issue | Runs when |
        | --- | --- |
        |  |  |
    validations:
      required: true

  - type: textarea
    id: crossings
    attributes:
      label: What crosses them
      description: >
        Dependencies between the issues above, and every file two of them both
        write. Say which to sequence around which, not merely that they touch.
        Record dependencies as GitHub issue dependencies as well; this table is
        what a reader gets, that relation is what GitHub enforces.
      value: |
        | Crossing | Sequence |
        | --- | --- |
        |  |  |
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: Source
      description: The idea file, spec, or discussion this came from.
    validations:
      required: false

  - type: textarea
    id: not-in-this-epic
    attributes:
      label: Not in this epic
      description: Scope this must not absorb. A worker that finds it files it separately.
    validations:
      required: false
