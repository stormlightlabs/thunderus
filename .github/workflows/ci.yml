name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests and doctests
        run: cargo test --workspace --all-features --locked
      - name: Build strict API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Build public documentation
        run: pnpm --dir docs build
      - name: Verify the thndrs-agent package
        run: cargo package -p thndrs-agent --locked
      - name: Show the thndrs-agent archive contents
        run: tar -tzf target/package/thndrs-agent-0.1.0.crate
      - name: Check patches and generated changes
        run: |
          git diff --check
          git diff --exit-code

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets at the declared MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88"
          command: check
          arguments: --all-features --locked
