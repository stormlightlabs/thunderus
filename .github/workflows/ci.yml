name: CI

on:
  push:
    branches: [main, edge]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install test tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests and doctests
        run: cargo test --workspace --all-features --locked
      - name: Build strict API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Build public documentation
        run: pnpm --dir docs build
      - name: Verify the thndrs-agent package
        run: cargo package -p thndrs-agent --locked
      - name: Show the thndrs-agent archive contents
        run: tar -tzf target/package/thndrs-agent-*.crate
      - name: Check patches and generated changes
        run: |
          git diff --check
          git diff --exit-code

  documents:
    name: Internal documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --since reads the base commit, which a shallow clone does not have.
          fetch-depth: 0
      - name: Check the checker
        run: .claude/scripts/check-frontmatter-test.py
      - name: Check every internal document
        run: .claude/scripts/check-frontmatter.py
      # An identifier that changes orphans every issue citing it, and no
      # snapshot of the tree can see that. Only a pull request has a base to
      # compare against.
      - name: Check no identifier changed
        if: github.event_name == 'pull_request'
        run: |
          .claude/scripts/check-frontmatter.py \
            --since "${{ github.event.pull_request.base.sha }}"

  definitions:
    name: Agent definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The harness provisions a worktree from an `isolation` key before any
      # skill is read, and places it inside the repository root where Cargo
      # reaches the parent .cargo/config.toml. The key is one edit away from
      # coming back, and nothing about the tree looks wrong once it has.
      - name: Check the checker
        run: .claude/scripts/check-isolation-test.py
      - name: Check every agent and skill definition
        run: .claude/scripts/check-isolation.py

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets at the declared MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88"
          command: check
          arguments: --all-features --locked

  hooks:
    name: Session start hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hook reports a failed step and carries on, so nothing a session
      # sees says when that rule breaks. The stubs make the failing case cheap
      # to run here: no toolchain, no network, and no cache to warm.
      - name: Check the session start hook
        run: .claude/hooks/session-start-test.py

