name: CI

on:
  push:
    branches: [main, edge]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Stable quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install test tool dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install documentation dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run workspace tests and doctests
        run: cargo test --workspace --all-features --locked
      - name: Build strict API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked
      - name: Build public documentation
        run: pnpm --dir docs build
      - name: Verify the thndrs-agent package
        run: cargo package -p thndrs-agent --locked
      - name: Show the thndrs-agent archive contents
        run: tar -tzf target/package/thndrs-agent-*.crate
      - name: Check patches and generated changes
        run: |
          git diff --check
          git diff --exit-code

  documents:
    name: Internal documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --since reads the base commit, which a shallow clone does not have.
          fetch-depth: 0
      - name: Check the checker
        run: .claude/scripts/check-frontmatter-test.py
      - name: Check every internal document
        run: .claude/scripts/check-frontmatter.py
      # An identifier that changes orphans every issue citing it, and no
      # snapshot of the tree can see that. Only a pull request has a base to
      # compare against.
      - name: Check no identifier changed
        if: github.event_name == 'pull_request'
        run: |
          .claude/scripts/check-frontmatter.py \
            --since "${{ github.event.pull_request.base.sha }}"

  commits:
    name: Commit messages
    # Only a pull request has a range to check. A push to edge or main carries
    # commits that were already checked on the branch they came from.
    #
    # This job reports and never fails. A message is cheap to fix while it sits
    # in the editor, which is where the commit-msg hook catches it, and dear to
    # fix afterwards: rewriting a pushed branch to correct a character count
    # costs more than the character count is worth. The warnings and the job
    # summary keep the state visible without gating the branch on it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The default shallow clone cannot see the base commit.
          fetch-depth: 0
      - name: Report every commit message on the branch
        run: |
          .claude/scripts/check-commit-message.py --warn --range \
            "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            | tee "$RUNNER_TEMP/commits.txt"
          {
            echo "### Commit messages"
            echo
            echo '```text'
            # The ::warning:: lines are annotations, not summary content.
            grep -v '^::' "$RUNNER_TEMP/commits.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Check all targets at the declared MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.88"
          command: check
          arguments: --all-features --locked

  hooks:
    name: Session start hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hook reports a failed step and carries on, so nothing a session
      # sees says when that rule breaks. The stubs make the failing case cheap
      # to run here: no toolchain, no network, and no cache to warm.
      - name: Check the session start hook
        run: .claude/hooks/session-start-test.py
